spring:
  application:
    name: mini-crm

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mini_crm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    addresses: ${AMQP_URL:amqp://localhost:5672}

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash

server:
  port: 8080

app:
  webhook:
    secret: ${WEBHOOK_SECRET:supersecretkey123}
  channel:
    service-url: ${CHANNEL_SERVICE_URL:http://localhost:3001/send}
